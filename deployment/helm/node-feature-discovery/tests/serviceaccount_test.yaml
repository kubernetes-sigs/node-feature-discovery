suite: service accounts
templates:
  - serviceaccount.yaml
release:
  name: nfd
  namespace: nfd-system
chart:
  version: 0.0.0-test
  appVersion: v0.0.0-test
tests:
  - it: matches the snapshot with default values
    asserts:
      - matchSnapshot: {}

  - it: adds the topology-updater service account when it is enabled
    set:
      topologyUpdater:
        enable: true
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: nfd-node-feature-discovery-topology-updater
        documentIndex: 1

  - it: skips service accounts that are not created by the chart
    set:
      master:
        serviceAccount:
          create: false
      gc:
        serviceAccount:
          create: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: nfd-node-feature-discovery-worker

  - it: skips service accounts of disabled components
    set:
      master:
        enable: false
      worker:
        enable: false
      gc:
        enable: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses custom names and annotations
    set:
      worker:
        serviceAccount:
          name: custom-worker
          annotations:
            example.com/role: worker
    asserts:
      - equal:
          path: metadata.name
          value: custom-worker
        documentIndex: 2
      - equal:
          path: metadata.annotations["example.com/role"]
          value: worker
        documentIndex: 2
