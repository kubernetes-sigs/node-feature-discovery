apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- core/
- gc/
- master/
- prune/
- topologyupdater/
- worker/
- manager/
# The manager checks /metrics requests with TokenReviews and
# SubjectAccessReviews (the rules in auth_proxy/role.yaml), and the
# metrics-reader ClusterRole grants GET /metrics to scrapers.
- auth_proxy/
